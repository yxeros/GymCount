  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;

    .overview::after { content: ""; position: absolute; width: 190px; height: 190px; top: -108px; right: -52px; border: 1px solid rgba(198, 210, 154, .16); border-radius: 50%; box-shadow: 0 0 0 20px rgba(198, 210, 154, .025), 0 0 0 42px rgba(198, 210, 154, .025); pointer-events: none; }

    .count-progress { height: 4px; overflow: hidden; margin-top: 12px; border-radius: 9px; background: #2a2d25; }
    .count-progress > span { display: block; height: 100%; min-width: 0; border-radius: inherit; background: var(--lime); transition: width .2s ease; }
    .counter-actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 15px; }
    .timer-card-display { display: flex; align-items: baseline; gap: 8px; }

    .timer-card-display span { color: var(--muted); font-size: 12px; }

    .add-card span { display: inline-grid; place-items: center; width: 26px; height: 26px; margin-right: 7px; border: 1px solid var(--line); border-radius: 9px; color: var(--accent); font-size: 18px; vertical-align: middle; }
    .active-banner { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 16px; padding: 13px 15px; border: 1px solid rgba(198,210,154,.26); border-radius: 17px; background: rgba(169,188,114,.08); text-align: left; cursor: pointer; }
    .active-banner-copy { min-width: 0; }
    .active-banner-copy span { display: block; color: var(--lime); font-size: 9px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .active-banner-copy strong { display: block; overflow: hidden; margin-top: 4px; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .active-banner-time { flex: none; color: var(--accent); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 760; }
    .empty-state { padding: 30px 20px; border: 1px dashed var(--line-strong); border-radius: 20px; text-align: center; }
    .empty-state .empty-icon { color: var(--lime); font-size: 27px; }
    .empty-state strong { display: block; margin-top: 10px; font-size: 14px; }
    .empty-state p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .bottom-nav { position: fixed; z-index: 5; right: 0; bottom: 0; left: 0; display: flex; justify-content: center; padding: 9px 16px calc(9px + var(--safe-bottom)); background: linear-gradient(180deg, rgba(11,12,10,0), rgba(11,12,10,.94) 28%); pointer-events: none; }
    .nav-inner { width: min(100%, 480px); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 5px; border: 1px solid var(--line); border-radius: 19px; background: rgba(24,26,22,.94); backdrop-filter: blur(16px); pointer-events: auto; }
    .nav-button { min-height: 47px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 720; cursor: pointer; }
    .nav-button.active { background: var(--surface-soft); color: var(--text); }
    .nav-button svg { width: 17px; height: 17px; }
    .history-summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 18px 0 24px; }
    .summary-tile { padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
    .summary-tile strong { display: block; font-size: 23px; letter-spacing: -.04em; }
    .summary-tile span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .history-list { display: grid; gap: 9px; }
    .history-item { display: flex; align-items: center; gap: 12px; padding: 15px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); }
    .history-icon { flex: none; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 13px; background: var(--surface-soft); color: var(--accent); font-size: 17px; }
    .history-copy { flex: 1; min-width: 0; }
    .history-copy strong { display: block; overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .history-copy span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .history-value { flex: none; text-align: right; font-size: 12px; font-weight: 720; }
    .history-value span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; font-weight: 500; }
    .modal-root:empty { display: none; }
    .modal-root { position: fixed; z-index: 10; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.7); backdrop-filter: blur(5px); }
    .sheet { width: min(100%, 680px); max-height: min(92dvh, 880px); overflow: auto; overscroll-behavior: contain; padding: 12px 20px calc(23px + var(--safe-bottom)); border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 27px 27px 0 0; background: #131510; box-shadow: 0 -14px 60px rgba(0,0,0,.28); animation: rise .22s ease-out; }
    @keyframes rise { from { transform: translateY(16px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
    .sheet-grab { width: 37px; height: 4px; margin: 0 auto 18px; border-radius: 9px; background: #484b41; }
    .sheet-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
    .sheet-header h2 { margin: 5px 0 0; font-size: 24px; letter-spacing: -.05em; }
    .sheet-header p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .sheet-close { flex: none; }
    .form-stack { display: grid; gap: 17px; }
    .field-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 10px; font-weight: 780; letter-spacing: .12em; text-transform: uppercase; }
    .text-input, .number-input { width: 100%; min-height: 50px; border: 1px solid var(--line-strong); border-radius: 14px; padding: 0 14px; background: #0e100d; color: var(--text); font-size: 14px; }
    .number-input { text-align: center; font-size: 18px; font-weight: 750; }
    .mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .mode-option { position: relative; }
    .mode-option input { position: absolute; opacity: 0; pointer-events: none; }
    .mode-option label { min-height: 72px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--muted); font-size: 10px; font-weight: 700; text-align: center; cursor: pointer; }
    .mode-option label span { font-size: 19px; }
    .mode-option input:checked + label { border-color: var(--accent); background: rgba(198,210,154,.08); color: var(--accent); }
    .mode-option input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
    .field-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; }
    .field-grid.three { grid-template-columns: repeat(3, 1fr); }
    .field-hint { margin-top: 6px; color: #797c70; font-size: 10px; }
    .form-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding-top: 4px; }
    .form-actions .button { min-height: 51px; }
    .delete-button { width: 100%; margin-top: 3px; color: var(--danger); }
    .session-sheet { padding-bottom: calc(21px + var(--safe-bottom)); }
    .session-progress { height: 5px; overflow: hidden; margin: 0 0 21px; border-radius: 9px; background: #292c24; }
    .session-progress > span { display: block; height: 100%; border-radius: inherit; background: var(--lime); transition: width .2s ease; }
    .session-stats { display: flex; gap: 20px; margin: -7px 0 19px; color: var(--muted); font-size: 11px; }
    .session-stats strong { color: var(--text); font-weight: 730; }
    .set-list { display: grid; gap: 8px; }
    .set-row { display: grid; grid-template-columns: 39px minmax(70px,1fr) minmax(130px,1.8fr); align-items: center; gap: 10px; min-height: 66px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); transition: border-color .15s, background .15s; }
    .set-row.done { border-color: rgba(169,188,114,.38); background: rgba(169,188,114,.1); }
    .set-number { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 11px; color: var(--muted); font-size: 13px; font-weight: 750; }
    .set-row.done .set-number { background: var(--lime); border-color: var(--lime); color: var(--accent-ink); }
    .set-reps-wrap { min-width: 0; text-align: center; }
    .set-reps-input { width: 100%; min-width: 40px; border: 0; background: transparent; color: var(--text); text-align: center; font-size: 18px; font-weight: 760; }
    .set-reps-label { display: block; color: var(--muted); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
    .set-check { min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 12px; background: #11130f; color: var(--text); font-size: 11px; font-weight: 700; cursor: pointer; }
    .set-check input { position: absolute; opacity: 0; pointer-events: none; }
    .checkmark { width: 19px; height: 19px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 6px; color: transparent; font-size: 13px; }
    .set-check:has(input:checked) { border-color: var(--lime); background: rgba(169,188,114,.12); }
    .set-check:has(input:checked) .checkmark { border-color: var(--lime); background: var(--lime); color: #171a12; }
    .rest-panel { margin: 14px 0 4px; padding: 17px; border: 1px solid rgba(198,210,154,.25); border-radius: 19px; background: linear-gradient(135deg, rgba(169,188,114,.1), rgba(169,188,114,.025)); text-align: center; }
    .rest-kicker { color: var(--lime); font-size: 9px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .rest-clock { margin: 5px 0 11px; font-variant-numeric: tabular-nums; font-size: 44px; font-weight: 760; letter-spacing: -.06em; }
    .rest-actions { display: flex; justify-content: center; gap: 8px; }
    .session-bottom { display: flex; gap: 8px; margin-top: 17px; }
    .session-bottom .button:first-child { flex: 1; }
    .timer-session { padding: 21px 0 4px; text-align: center; }
    .timer-ring { width: min(66vw, 290px); aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 22px; border: 1px solid rgba(198,210,154,.28); border-radius: 50%; background: radial-gradient(circle, rgba(169,188,114,.12) 0, rgba(169,188,114,.035) 56%, transparent 57%); box-shadow: 0 0 0 11px rgba(169,188,114,.035), 0 0 0 22px rgba(169,188,114,.025); }
    .timer-large { font-variant-numeric: tabular-nums; font-size: clamp(46px, 14vw, 67px); font-weight: 730; letter-spacing: -.07em; line-height: 1; }
    .timer-caption { margin-top: 9px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }

    .timer-controls .button { min-width: 125px; }
    .completed-state { padding: 22px 0 5px; text-align: center; }
    .completed-mark { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 14px; border-radius: 23px; background: rgba(169,188,114,.15); color: var(--lime); font-size: 31px; }
    .completed-state h3 { margin: 0; font-size: 25px; letter-spacing: -.045em; }
    .completed-state p { margin: 7px 0 20px; color: var(--muted); font-size: 12px; }
    .toast { position: fixed; z-index: 30; left: 50%; bottom: calc(91px + var(--safe-bottom)); width: max-content; max-width: calc(100% - 32px); padding: 12px 16px; border: 1px solid var(--line-strong); border-radius: 13px; background: #252820; color: var(--text); font-size: 12px; font-weight: 650; box-shadow: 0 8px 30px rgba(0,0,0,.3); transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: .2s ease; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

      .set-check { font-size: 10px; gap: 5px; }
      .filter-row { margin-right: -15px; margin-left: -15px; padding-right: 15px; padding-left: 15px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modalRoot" class="modal-root" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      'use strict';
      const STORAGE_KEY = 'ritmo-workout-v1';
      const todayKey = () => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      };
      const makeId = () => (crypto && crypto.randomUUID ? crypto.randomUUID() : `ex-${Date.now()}-${Math.random().toString(16).slice(2)}`);
      const defaults = () => ({
        exercises: [
          { id: 'pull-up', name: 'Barra fixa', type: 'series', sets: 5, reps: 5, restSeconds: 120 },
          { id: 'push-ups', name: 'Flexões', type: 'counter', repsPerSet: 75 },
          { id: 'plank', name: 'Prancha', type: 'timer', durationSeconds: 300 }

          });
        } catch (error) { /* Áudio pode estar bloqueado até uma interação do usuário. */ }
      }
      function unlockAudio() {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          audioContext ||= new Ctx();
          if (audioContext.state === 'suspended') audioContext.resume().catch(()=>{});
        } catch (error) { /* Alguns navegadores podem não oferecer áudio web. */ }
      }
      function vibrate() { try { navigator.vibrate?.([130,70,180]); } catch (error) {} }
      async function updateTimerWakeLock() {
        const session = state.activeSession;
        const shouldHold = session?.type === 'timer' ? Boolean(session.endAt) : session?.type === 'series' && Boolean(session.restUntil);
        if (shouldHold && !wakeLock && navigator.wakeLock?.request) {
          try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{ wakeLock=null; }); } catch (error) { wakeLock = null; }
        } else if (!shouldHold && wakeLock) {
          try { await wakeLock.release(); } catch (error) {} wakeLock = null;
        }
      }
      function addCounter(id) {
        const exercise = getExercise(id);
        if (!exercise) return;
        const dates = state.counters[id] || (state.counters[id] = {});
        const entries = dates[todayKey()] || (dates[todayKey()] = []);
        entries.push({ reps: Number(exercise.repsPerSet), at: Date.now() });
        save(); render(); toast(`＋ ${exercise.repsPerSet} reps registradas`);
      }
      function undoCounter(id) {
        const exercise = getExercise(id);
        const entries = exercise && counterEntries(exercise);
        if (!entries?.length) return;
        entries.pop(); save(); render(); toast('Última série desfeita.');
      }
      function handleFormSubmit(event) {
        if (event.target.id !== 'exercise-form') return;
        event.preventDefault();
        const form = event.target;
        const data = new FormData(form);
        const id = form.dataset.id || makeId();
        const type = data.get('type');
        const exercise = { id, name: String(data.get('name')).trim(), type };
        if (type === 'series') Object.assign(exercise, { sets: Number(data.get('sets')), reps: Number(data.get('reps')), restSeconds: Math.round(Number(data.get('restMinutes')) * 60) });
        if (type === 'counter') Object.assign(exercise, { repsPerSet: Number(data.get('repsPerSet')) });
        if (type === 'timer') Object.assign(exercise, { durationSeconds: Number(data.get('durationMinutes')) * 60 + Number(data.get('durationRemainder')) });
        if (!exercise.name || (type === 'timer' && exercise.durationSeconds < 1)) { toast('Confira o nome e o tempo do exercício.'); return; }
        const index = state.exercises.findIndex(item => item.id === id);
        if (index >= 0) state.exercises[index] = exercise; else state.exercises.push(exercise);
        save(); closeModal(); currentView = 'workouts'; currentFilter = 'all'; render(); toast(index >= 0 ? 'Exercício atualizado.' : 'Exercício adicionado.');
      }
      function action(action, target) {
        const id = target.dataset.id;
        switch (action) {
          case 'add': openEditor(); break;
          case 'edit': openEditor(id); break;
          case 'close-modal': closeModal(); break;
          case 'close-session': if (state.activeSession) state.activeSession.visible = false; save(); closeModal(); render(); break;
          case 'delete': {
            if (!window.confirm('Excluir este exercício? Os contadores salvos também serão apagados.')) return;
            state.exercises = state.exercises.filter(item=>item.id!==id); delete state.counters[id];
            if (state.activeSession?.exerciseId===id) state.activeSession=null;
            save(); closeModal(); render(); toast('Exercício excluído.'); break;
          }
          case 'start': startSession(id); break;
          case 'resume-session': if (state.activeSession) { state.activeSession.visible=true; save(); render(); } break;
          case 'counter-add': addCounter(id); break;
          case 'counter-undo': undoCounter(id); break;
          case 'filter': currentFilter=target.dataset.filter; render(); break;
          case 'view': currentView=target.dataset.view; render(); break;
          case 'rest-skip': if (state.activeSession) { state.activeSession.restUntil=null; state.activeSession.restRemaining=0; state.activeSession.restDone=false; save(); renderSession(); updateTimerWakeLock(); } break;
          case 'rest-clear': if (state.activeSession) { state.activeSession.restDone=false; save(); renderSession(); updateTimerWakeLock(); } break;
          case 'rest-plus': if (state.activeSession) { const s=state.activeSession; if (s.restUntil) s.restUntil+=15000; else s.restRemaining=(s.restRemaining||0)+15; save(); renderSession(); updateTimerWakeLock(); } break;
          case 'session-finish': {
            const s=state.activeSession;
            if (!s) break;
            const completed=s.completed.filter(Boolean).length;
            if (completed===0) { state.activeSession=null; save(); closeModal(); render(); toast('Treino encerrado.'); break; }
            if (completed<s.completed.length && !window.confirm(`Encerrar e salvar ${completed} ${completed===1?'série':'séries'} concluídas?`)) break;
            recordSession(s); closeModal(); render(); toast('Treino salvo no seu histórico.'); break;
          }
          case 'timer-toggle': {
            const s=state.activeSession;
            if (!s || s.type!=='timer') break;
            if (s.endAt) { s.remaining=Math.max(0,Math.ceil((s.endAt-Date.now())/1000)); s.endAt=null; }
            else { s.endAt=Date.now()+Math.max(1,s.remaining)*1000; }
            save(); renderSession(); updateTimerWakeLock(); break;
          }
          case 'timer-reset': {
            const s=state.activeSession;
            if (!s || s.type!=='timer') break;
            s.remaining=s.durationSeconds; s.endAt=null; s.finished=false; save(); renderSession(); updateTimerWakeLock(); break;
          }
          case 'timer-finish': {
            const s=state.activeSession;
            if (!s || s.type!=='timer') break;
            if (!window.confirm('Concluir este timer agora?')) break;
            const remaining=s.endAt ? Math.max(0,Math.ceil((s.endAt-Date.now())/1000)) : s.remaining;
            s.loggedDurationSeconds=Math.max(1,s.durationSeconds-Math.max(0,remaining));
            s.endAt=null; s.remaining=0; s.finished=true; save(); renderSession(); updateTimerWakeLock(); break;
          }
          case 'finish-session': {
            const s=state.activeSession;
            if (!s) break;
            recordSession(s); closeModal(); render(); toast('Timer salvo no seu histórico.'); break;
          }
        }
      }
      document.addEventListener('pointerdown', unlockAudio, { once: true });
      document.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (target) action(target.dataset.action, target);
        else if (event.target === modalRoot) {
          if (state.activeSession?.visible) { state.activeSession.visible=false; save(); render(); }
          else closeModal();
        }
      });
      document.addEventListener('submit', handleFormSubmit);
      document.addEventListener('change', event => {
        if (event.target.matches('input[name="type"]')) {
          const form = document.getElementById('exercise-form');
          const existing = form?.dataset.id ? getExercise(form.dataset.id) : null;
          document.getElementById('mode-fields').innerHTML = modeFields(event.target.value, existing);
        } else if (event.target.matches('[data-session-set]')) {
          markSet(Number(event.target.dataset.sessionSet), event.target.checked);
        } else if (event.target.matches('[data-session-reps]')) {
          const session=state.activeSession; const index=Number(event.target.dataset.sessionReps); const value=Math.max(1,Number(event.target.value)||1);
          if (session?.type==='series') { session.reps[index]=value; save(); }
        }
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') tick();
      });
      function tick() {
        const session = state.activeSession;
        if (session?.type === 'series' && session.restUntil) {
          const left = Math.max(0, Math.ceil((session.restUntil-Date.now())/1000));
          document.querySelectorAll('[data-rest-clock]').forEach(el=>el.textContent=clockText(left));
          if (left <= 0) {
            session.restUntil=null; session.restRemaining=0; session.restDone=true; save(); playChime(); vibrate(); updateTimerWakeLock();
            if (session.visible) renderSession();
            toast('Descanso finalizado.');
          }
        }
        if (session?.type === 'timer' && session.endAt) {
          const left = Math.max(0,Math.ceil((session.endAt-Date.now())/1000));
          document.querySelectorAll('[data-timer-clock]').forEach(el=>el.textContent=clockText(left));
          document.querySelectorAll(`[data-card-timer="${CSS.escape(session.exerciseId)}"]`).forEach(el=>el.textContent=clockText(left));
          document.querySelectorAll('.active-banner-time').forEach(el=>el.textContent=clockText(left));
          if (left <= 0) completeTimer();
        }
        if (session?.type === 'timer' && session.visible && session.finished) { /* Completion view remains until acknowledged. */ }
      }
      setInterval(tick, 250);
      render();
      if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
      }
    })();
  </script>
</body>
</html>
